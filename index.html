    <script>
      if ('serviceWorker' in navigator) {
        // Automatically reload page when a new service worker takes control
        let isRefreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!isRefreshing) {
            isRefreshing = true;
            window.location.reload();
          }
        });

        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(reg) {
              console.log('PWA Service Worker registered:', reg.scope);

              // Actively check for Service Worker updates on page load
              reg.update();

              // Listen for an incoming new service worker
              reg.addEventListener('updatefound', function() {
                var newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', function() {
                    // When installed and there is an existing active controller, prompt skipWaiting
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                }
              });
            })
            .catch(function(err) {
              console.warn('PWA Service Worker registration failed:', err);
            });
        });
      }
    </script>
